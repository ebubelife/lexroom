<svg width="280" height="56" viewBox="0 0 280 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Scales Icon -->
  <!-- Center post -->
  <line x1="22" y1="6" x2="22" y2="50" stroke="#C9A84C" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Base -->
  <line x1="12" y1="50" x2="32" y2="50" stroke="#C9A84C" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Crossbar -->
  <line x1="6" y1="17" x2="38" y2="17" stroke="#C9A84C" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Left chain -->
  <line x1="6" y1="17" x2="5" y2="31" stroke="#C9A84C" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <!-- Right chain -->
  <line x1="38" y1="17" x2="37" y2="26" stroke="#C9A84C" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <!-- Left pan -->
  <path d="M1 33 Q5 39 9 33" stroke="#C9A84C" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <!-- Right pan (higher) -->
  <path d="M33 28 Q37 34 41 28" stroke="#C9A84C" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.85"/>
  <!-- Pivot dot -->
  <circle cx="22" cy="6" r="2.2" fill="#C9A84C"/>

  <!-- Vertical rule divider -->
  <line x1="58" y1="12" x2="58" y2="44" stroke="#C9A84C" stroke-width="0.75" opacity="0.35"/>

  <!-- Wordmark: First -->
  <text x="72" y="38"
    font-family="Georgia, 'Times New Roman', Times, serif"
    font-size="28"
    font-weight="700"
    font-style="normal"
    fill="#FFFFFF"
    letter-spacing="0.5">First</text>

  <!-- Wordmark: Mediator (italic, gold) -->
  <text x="136" y="38"
    font-family="Georgia, 'Times New Roman', Times, serif"
    font-size="28"
    font-weight="400"
    font-style="italic"
    fill="#C9A84C"
    letter-spacing="1">Mediator</text>
</svg>
