<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — FirstMediator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0D1B2A 0%, #1a2332 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 500px;
        }
        .icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            opacity: 0.8;
        }
        h1 {
            font-family: 'Instrument Serif', serif;
            font-size: 2rem;
            margin-bottom: 15px;
            color: #C9A84C;
        }
        p {
            font-size: 1rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: #C9A84C;
            color: #0D1B2A;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: opacity 0.3s;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .status {
            margin-top: 20px;
            font-size: 0.875rem;
            color: rgba(255, 255, 255, 0.5);
        }
        .pulse {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #DC2626;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="container">
        <svg class="icon" viewBox="0 0 48 56" fill="none" xmlns="http://www.w3.org/2000/svg">
            <line x1="24" y1="6" x2="24" y2="50" stroke="#C9A84C" stroke-width="2" stroke-linecap="round"/>
            <line x1="12" y1="50" x2="36" y2="50" stroke="#C9A84C" stroke-width="2" stroke-linecap="round"/>
            <line x1="4" y1="17" x2="44" y2="17" stroke="#C9A84C" stroke-width="1.6" stroke-linecap="round"/>
            <line x1="4" y1="17" x2="3" y2="31" stroke="#C9A84C" stroke-width="1.1" stroke-linecap="round" opacity="0.7"/>
            <line x1="44" y1="17" x2="43" y2="27" stroke="#C9A84C" stroke-width="1.1" stroke-linecap="round" opacity="0.7"/>
            <path d="M0 33 Q3 40 6 33" stroke="#C9A84C" stroke-width="1.6" fill="none" stroke-linecap="round"/>
            <path d="M39 29 Q43 36 47 29" stroke="#C9A84C" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.85"/>
            <circle cx="24" cy="6" r="2.5" fill="#C9A84C"/>
        </svg>

        <h1>You're Offline</h1>
        <p>It looks like you've lost your internet connection. Don't worry, your data is safe. Reconnect to continue using FirstMediator.</p>
        
        <a href="/" class="btn" onclick="window.location.reload(); return false;">Try Again</a>
        
        <div class="status">
            <span class="pulse"></span>
            Waiting for connection...
        </div>
    </div>

    <script>
        // Auto-reload when back online
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
